---
layout: default
title: "Tag: children"
permalink: /tags/children/
---
<h1>Posts tagged with #children</h1>

<p><a href="{{ '/tags/' | relative_url }}">← All tags</a></p>

<ul class="posts-list">
{% for entry in site.entries %}
  {% if entry.tags contains "children" %}
  <li>
    <article>
      <h3><a href="{{ entry.url | relative_url }}">{{ entry.title }}</a></h3>
      <p class="post-meta">
        <time>{{ entry.date | date: "%B %d, %Y" }}</time>
      </p>
    </article>
  </li>
  {% endif %}
{% endfor %}
</ul>
